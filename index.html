<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東興國中 907 班成績查詢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16233B; --muted:#5B6780; --paper:#F3F6FA; --panel:#FFFFFF; --line:#D6DEE8;
  --blue:#2B5C94; --blue-soft:#DCE8F5; --good:#1F7A60; --warn:#B3432C;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.65}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;line-height:1.3;margin:8px 0 4px;font-weight:700}
h2{font-size:17px;margin:28px 0 10px;font-weight:700}
.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
label{display:block;font-weight:500;margin:12px 0 4px;font-size:15px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{font:inherit;font-weight:700;background:var(--ink);color:#fff;border:0;border-radius:6px;padding:11px 18px;cursor:pointer;margin-top:16px;min-height:44px}
.btn:disabled{opacity:.55;cursor:wait}
.err{color:var(--warn);margin:12px 0 0;font-size:15px}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.who{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:4px 0 14px}
.who b{font-size:18px}
.linkbtn{font:inherit;background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;padding:6px 0;min-height:44px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.tab{font:inherit;font-size:15px;white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;color:var(--ink);min-height:44px}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.rank{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.rank .big{font-size:56px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.rank .cap{color:var(--muted);font-size:14px;padding-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:16px}
.stat{border-top:2px solid var(--line);padding-top:6px}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:9px 6px;border-bottom:1px solid var(--line);font-size:15px}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--muted);font-size:13px}
.up{color:var(--good)} .down{color:var(--warn)}
.radar{display:block;width:100%;max-width:360px;margin:4px auto 0}
.legend{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:14px;height:0;border-top:3px solid var(--blue);vertical-align:middle;margin-right:6px}
.legend i.dash{border-top:2px dashed var(--muted)}
.dist{display:grid;grid-template-columns:52px repeat(6,1fr);gap:6px;align-items:end;margin-bottom:8px}
.dist .nm{font-size:14px}
.dist .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:46px;font-size:12px;color:var(--muted)}
.dist .bar{width:100%;background:var(--line);border-radius:2px 2px 0 0;min-height:2px}
.dist .c.me .bar{background:var(--blue)}
.dist .c.me{color:var(--blue);font-weight:700}
.dist .hd{font-size:12px;color:var(--muted);text-align:center}
.note{color:var(--muted);font-size:13px;margin-top:10px}
.empty{padding:28px 8px;color:var(--muted)}
.hist{display:flex;align-items:flex-end;gap:4px;height:96px;margin-top:8px}
.hist .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;color:var(--muted);height:100%}
.hist .col .bar{width:100%;background:var(--line);border-radius:2px 2px 0 0;min-height:2px}
.hist .col.me .bar{background:var(--blue)}
.hist .col.me{color:var(--blue);font-weight:700}
.medal{vertical-align:-4px}
.gold{color:#B8860B}
.award{display:inline-flex;align-items:center;gap:3px;background:#A63A27;color:#fff;border-radius:999px;padding:1px 9px 1px 6px;font-size:13px;font-weight:700;line-height:1.6;letter-spacing:.5px}
.champ{display:inline-flex;align-items:center;gap:6px;background:#FFF4D1;border:1px solid #E2B33C;color:#7A5A08;border-radius:999px;padding:4px 14px 4px 8px;font-weight:700;font-size:15px;margin-bottom:6px}
.tag{display:inline-block;font-size:12px;line-height:1.6;padding:0 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:500}
.tag.good{color:var(--good);border-color:var(--good)}
.tag.warn{color:var(--warn);border-color:var(--warn)}
.diag{margin:0;padding-left:20px}
.diag li{margin:6px 0}
.trend{display:block;width:100%;max-width:420px;margin:6px auto 0}
.strat{background:#F7FAFD}
.strat h3{font-size:15px;margin:16px 0 4px;color:var(--blue)}
.strat h3:first-of-type{margin-top:4px}
.strat p{margin:4px 0}
.strat ul,.strat ol{margin:4px 0;padding-left:20px}
.strat li{margin:4px 0}
.strat .meta{font-size:14px;color:var(--muted);margin:0 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.chip{font:inherit;font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--ink);cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.blk{margin:0}
.top .who{margin:4px 0 14px}
@media (min-width:1100px){
  body.results{font-size:14px;line-height:1.55}
  body.results .wrap{max-width:1780px;padding:12px 20px 20px}
  body.results .top{display:flex;flex-wrap:wrap;align-items:center;gap:0 20px;margin-bottom:8px}
  body.results .top .who{margin:0;gap:16px}
  body.results .top .tabs{margin:0;padding:0}
  .dash{column-count:3;column-gap:16px}
  .blk{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;margin:0 0 12px}
  .blk.span{column-span:all}
  .blk>h2:first-child{margin:0 0 6px;font-size:15px}
  body.results .panel{padding:12px}
  body.results .rank .big{font-size:44px}
  body.results .stats{margin-top:10px}
  body.results th,body.results td{padding:6px 6px;font-size:14px}
  body.results .radar{max-width:300px}
  body.results .strat h3{margin:10px 0 2px}
  body.results .hist{height:84px}
}
@media (min-width:1700px){ .dash{column-count:4} }
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>東興國中 907 班成績查詢</h1>
  <p class="sub">請輸入座號、學生姓名與導師提供的驗證碼。</p>

  <form id="loginForm" class="panel" autocomplete="off" novalidate>
    <label for="seat">座號</label>
    <input id="seat" inputmode="numeric" maxlength="2" required>
    <label for="name">學生姓名</label>
    <input id="name" required>
    <label for="code">驗證碼</label>
    <input id="code" type="password" required>
    <button class="btn" id="submitBtn" type="submit">查詢成績</button>
    <p class="err" id="err" role="alert" hidden></p>
    <p class="hint">連續輸入錯誤多次會暫時鎖定,請稍後再試。</p>
  </form>

  <div id="result" hidden></div>
  <p class="hint" style="margin-top:28px">頁面版本:20261102-2</p>
</div>

<script>
// 只有放在 GitHub Pages 時才會用到:貼上 Apps Script「網頁應用程式網址」(以 /exec 結尾)。在 Apps Script 內開啟時會忽略。
var API_URL = 'https://script.google.com/macros/s/AKfycbwotaDvV7PaIKKZbVyAzFB9QncMkzbZHxKDg9isT-SZlrssmQFy9uj2mnmy8CKBMHN6/exec';

var state = { data: null, exam: 0, trendSel: { regular: '平均', mock: '總積分' } };
var BUCKETS = ['60以下', '60–69', '70–79', '80–89', '90–99', '100'];

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function fmt(v, d) { return v == null ? '—' : (d == null ? String(v) : Number(v).toFixed(d)); }
function rankText(v) { return v == null ? '—' : '第 ' + v + ' 名'; }

$('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var seat = $('seat').value, name = $('name').value, code = $('code').value;
  var err = $('err'), btn = $('submitBtn');
  if (!seat.trim() || !name.trim() || !code.trim()) {
    err.textContent = '請填寫座號、姓名與驗證碼。'; err.hidden = false; return;
  }
  err.hidden = true; btn.disabled = true; btn.textContent = '查詢中…';
  var done = function () { btn.disabled = false; btn.textContent = '查詢成績'; };
  var fail = function (msg) { done(); err.textContent = msg; err.hidden = false; };
  var show = function (res) {
    done();
    if (!res.ok) { err.textContent = res.message; err.hidden = false; return; }
    $('code').value = '';
    state.data = res; state.exam = latestOk(res.exams, null);
    $('loginForm').hidden = true;
    document.querySelector('.sub').hidden = true;
    render();
  };

  // 在 Apps Script 頁面內執行:用 google.script.run
  if (window.google && google.script && google.script.run) {
    google.script.run.withSuccessHandler(show)
      .withFailureHandler(function () { fail('連線失敗,請重新整理頁面後再試。'); })
      .queryScores(seat, name, code);
    return;
  }

  // 在 GitHub Pages 等外部網站執行:用 fetch 呼叫 Apps Script API
  if (API_URL.indexOf('script.google.com') < 0 || API_URL.indexOf('請換成') >= 0) { fail('系統尚未設定完成,請聯絡導師。'); return; }
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 30000);
  fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },  // 不觸發 CORS 預檢
    body: JSON.stringify({ action: 'query', seat: seat, name: name, code: code }),
    signal: ctrl.signal
  })
    .then(function (r) { return r.json(); })
    .then(function (res) { clearTimeout(timer); show(res); })
    .catch(function () {
      clearTimeout(timer);
      fail('連線失敗或逾時,請檢查網路後再試一次。');
    });
});

/* 回傳指定類別(null 代表全部)中最後一場已有成績的考試索引;沒有就回傳該類別第一場 */
function latestOk(exams, type) {
  var last = -1, first = -1;
  exams.forEach(function (ex, i) {
    if (type && ex.type !== type) return;
    if (first < 0) first = i;
    if (ex.status === 'ok') last = i;
  });
  return last >= 0 ? last : Math.max(first, 0);
}

$('result').addEventListener('click', function (e) {
  var b = e.target && e.target.closest ? e.target.closest('.chip') : null;
  if (!b || !state.data) return;
  var kind = b.getAttribute('data-kind');
  state.trendSel[kind] = b.getAttribute('data-k');
  var cur = state.data.exams[state.exam], box = $('trend-' + kind);
  if (box) box.innerHTML = kind === 'regular' ? regularTrendBody(cur) : mockTrendBody(cur);
});

function logout() {
  state.data = null;
  if (document.body && document.body.classList) document.body.classList.remove('results');
  $('result').hidden = true; $('result').innerHTML = '';
  $('loginForm').hidden = false;
  document.querySelector('.sub').hidden = false;
  $('seat').focus();
}

function render() {
  var d = state.data, root = $('result');
  var cur = d.exams[state.exam];
  var groups = [['regular', '定期評量'], ['mock', '模擬考']];
  var gtabs = groups.map(function (g) {
    return '<button class="tab" data-g="' + g[0] + '" aria-selected="' + (cur.type === g[0]) + '">' + g[1] + '</button>';
  }).join('');
  var etabs = d.exams.map(function (ex, i) {
    return ex.type !== cur.type ? '' :
      '<button class="tab" role="tab" aria-selected="' + (i === state.exam) + '" data-i="' + i + '">' + esc(ex.label) + '</button>';
  }).join('');
  root.innerHTML =
    '<div class="top"><div class="who"><span><b>' + esc(d.student.name) + '</b>(' + esc(d.student.seat) + ' 號)</span>' +
    '<button class="linkbtn" id="logoutBtn">登出</button></div>' +
    '<div class="tabs" role="group" aria-label="考試類別">' + gtabs + '</div>' +
    '<div class="tabs" role="tablist" aria-label="考試次數">' + etabs + '</div></div>' +
    '<div id="examBody" class="dash"></div>';
  if (document.body && document.body.classList) document.body.classList.add('results');
  root.hidden = false;
  $('logoutBtn').onclick = logout;
  Array.prototype.forEach.call(root.querySelectorAll('.tab[data-i]'), function (b) {
    b.onclick = function () { state.exam = +b.dataset.i; render(); };
  });
  Array.prototype.forEach.call(root.querySelectorAll('.tab[data-g]'), function (b) {
    b.onclick = function () { state.exam = latestOk(d.exams, b.dataset.g); render(); };
  });
  var ex = d.exams[state.exam], body = $('examBody');
  if (ex.status === 'pending') body.innerHTML = '<div class="panel empty">這次考試的成績尚未公布。</div>';
  else if (ex.status === 'ok') body.innerHTML = ex.type === 'mock' ? mockHtml(ex) : regularHtml(ex);
  else body.innerHTML = '<div class="panel empty">這份成績暫時無法顯示,請聯絡導師。</div>';
}

/* ---------- 共用元件 ---------- */

function blk(html, cls) { return '<div class="blk' + (cls ? ' ' + cls : '') + '">' + html + '</div>'; }

function medal(size) {
  return '<svg class="medal" width="' + size + '" height="' + Math.round(size * 1.25) + '" viewBox="0 0 32 40" role="img" aria-label="冠軍金獎">' +
    '<path d="M7 0h7l5 15h-7z" fill="#2B5C94"/><path d="M25 0h-7l-5 15h7z" fill="#B3432C"/>' +
    '<circle cx="16" cy="26" r="12" fill="#E2B33C" stroke="#B88A12" stroke-width="2"/>' +
    '<circle cx="16" cy="26" r="8.2" fill="none" stroke="#F7DE8A" stroke-width="1.5"/>' +
    '<text x="16" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#7A5A08" font-family="sans-serif">1</text></svg>';
}
function champBadge() { return '<span class="champ">' + medal(20) + '冠軍金獎</span>'; }
var AWARD_TOP = 100;   // 校排前 N 名顯示「特優」標章

function awardBadge() {
  return '<span class="award" role="img" aria-label="校排前' + AWARD_TOP + '名特優">' +
    '<svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L2 9.2l7.1-.6z" fill="#FFE08A"/></svg>特優</span>';
}
function statHtml(k, html, rank) {
  return '<div class="stat"><div class="k">' + k + '</div><div class="v">' + (rank === 1 ? medal(16) : '') + '<span>' + html + '</span></div></div>';
}
function stat(k, v) { return statHtml(k, esc(v), null); }
function rankStat(k, rank, award) {
  var txt = rank == null ? '—' : '第 ' + (rank === 1 ? '<span class="gold">1</span>' : rank) + ' 名';
  var badge = (award && rank != null && rank <= AWARD_TOP) ? awardBadge() : '';
  return statHtml(k, txt, rank).replace('</span></div></div>', '</span>' + badge + '</div></div>');
}

/* ---------- 定期評量 ---------- */

function regularHtml(ex) {
  var list = ex.subjects;
  var h = blk('<div class="panel">' +
    '<div class="rank"><span class="big' + (ex.classRank === 1 ? ' gold' : '') + '">' + (ex.classRank == null ? '—' : ex.classRank) + '</span>' +
    (ex.classRank === 1 ? champBadge() : '') +
    '<span class="cap">班排名(全班 ' + ex.classSize + ' 人)</span></div>' +
    '<div class="stats">' +
    stat('總分', fmt(ex.total, 1)) + stat('平均', fmt(ex.avg, 1)) +
    (ex.schoolRank != null ? rankStat('校排', ex.schoolRank, true) : '') +
    (ex.writing != null ? stat('寫作', fmt(ex.writing)) : '') +
    '</div></div>', 'span');

  h += blk('<h2>各科表現</h2><div class="panel">' + radar(list, 100, 5) +
    '<div class="legend"><span><i></i>本人</span><span><i class="dash"></i>班平均</span></div></div>');

  h += blk('<h2>各科分數</h2><div class="panel"><table><thead><tr><th>科目</th><th>本人</th><th>班平均</th><th>差距</th></tr></thead><tbody>' +
    list.map(function (s) {
      var diff = (s.score != null && s.classAvg != null) ? s.score - s.classAvg : null;
      var cls = diff == null ? '' : (diff >= 0 ? 'up' : 'down');
      var dtxt = diff == null ? '—' : (diff >= 0 ? '+' : '−') + Math.abs(diff).toFixed(1);
      return '<tr><td>' + esc(s.name) + '</td><td>' + fmt(s.score, 1) + '</td><td>' + fmt(s.classAvg, 1) + '</td><td class="' + cls + '">' + dtxt + '</td></tr>';
    }).join('') + '</tbody></table></div>');

  h += blk('<h2>歷次定期評量趨勢</h2><div class="panel">' + regularTrend(ex) + '</div>');

  h += blk('<h2>全班分數分布</h2><div class="panel">' +
    '<div class="dist"><span></span>' + BUCKETS.map(function (b) { return '<span class="hd">' + b + '</span>'; }).join('') + '</div>' +
    list.map(distRow).join('') +
    '<p class="note">藍色為你所在的分數區間,數字為該區間的人數;「100」為滿分的人數。</p></div>');
  return h;
}

function chips(kind, items, sel) {
  return '<div class="chips" role="group" aria-label="選擇要看的項目">' + items.map(function (n) {
    return '<button class="chip" data-kind="' + kind + '" data-k="' + esc(n) + '" aria-pressed="' + (n === sel) + '">' + esc(n) + '</button>';
  }).join('') + '</div>';
}
function findSub(e, name) {
  for (var i = 0; i < e.subjects.length; i++) if (e.subjects[i].name === name) return e.subjects[i];
  return null;
}

function regularTrend(cur) { return '<div id="trend-regular">' + regularTrendBody(cur) + '</div>'; }

function regularTrendBody(cur) {
  var all = state.data.exams.filter(function (e) { return e.type === 'regular' && e.status === 'ok'; });
  if (all.length < 2) return '<p class="note">目前只有一次定期評量成績,之後會在這裡顯示歷次的變化。</p>';
  var sel = state.trendSel.regular, isAvg = sel === '平均';
  if (!isAvg && !findSub(cur, sel)) sel = state.trendSel.regular = '平均', isAvg = true;
  var pts = all.map(function (e) {
    var v, c;
    if (isAvg) { v = e.avg; c = e.classAvg != null ? e.classAvg : mean(e.subjects.map(function (s) { return s.classAvg; })); }
    else { var s = findSub(e, sel); v = s ? s.score : null; c = s ? s.classAvg : null; }
    return { label: e.label, v: v, c: c, me: e === cur };
  });
  var vals = [];
  pts.forEach(function (p) { if (p.v != null) vals.push(p.v); if (p.c != null) vals.push(p.c); });
  if (!vals.length) return chips('regular', ['平均'].concat(cur.subjects.map(function (s) { return s.name; })), sel) + '<p class="note">這個項目沒有資料。</p>';
  var lo = Math.max(0, Math.floor((Math.min.apply(null, vals) - 5) / 10) * 10);
  return chips('regular', ['平均'].concat(cur.subjects.map(function (s) { return s.name; })), sel) +
    trend(pts, { min: lo, max: 100, step: (100 - lo) > 60 ? 20 : 10, fmt: function (v) { return Number(v).toFixed(1).replace(/\.0$/, ''); } }) +
    '<div class="legend"><span><i></i>本人' + (isAvg ? '平均' : esc(sel)) + '</span><span><i class="dash"></i>班平均</span></div>';
}

/* 模擬考:總積分或各科答對題數 */
function mockTrendBody(cur) {
  var all = state.data.exams.filter(function (e) { return e.type === 'mock' && e.status === 'ok'; });
  if (all.length < 2) return '<p class="note">目前只有一次模擬考成績,之後會在這裡顯示歷次趨勢。</p>';
  var names = cur.subjects.map(function (s) { return s.name; });
  var sel = state.trendSel.mock, isTotal = sel === '總積分', isW = sel === '數學' || sel === '英語';
  if (!isTotal && names.indexOf(sel) < 0) sel = state.trendSel.mock = '總積分', isTotal = true;
  var items = ['總積分'].concat(names);
  var pts = all.map(function (e) {
    var v, c, lab = e.label.replace('模擬考', '');
    if (isTotal) { v = e.total; c = e.classAvg; }
    else {
      var s = findSub(e, sel);
      if (isW) { v = s ? (s.weighted != null ? s.weighted : (s.extra ? s.extra.weighted : null)) : null; c = s ? s.classAvgWeighted : null; }
      else { v = s ? s.correct : null; c = s ? s.classAvgCorrect : null; }
    }
    return { label: lab, v: v, c: c, me: e === cur };
  });
  var o;
  if (isTotal) o = { min: 0, max: 30, step: 10, fmt: function (v) { return v; } };
  else {
    var vals = [];
    pts.forEach(function (p) { if (p.v != null) vals.push(p.v); if (p.c != null) vals.push(p.c); });
    if (!vals.length) return chips('mock', items, sel) + '<p class="note">這個科目沒有' + (isW ? '加權分數' : '答對題數') + '資料。</p>';
    var lo, hi;
    if (isW) { lo = Math.max(0, Math.floor((Math.min.apply(null, vals) - 5) / 10) * 10); hi = 100; }
    else { lo = Math.max(0, Math.floor((Math.min.apply(null, vals) - 3) / 5) * 5); hi = Math.ceil((Math.max.apply(null, vals) + 3) / 5) * 5; }
    o = { min: lo, max: hi, step: isW ? ((hi - lo) > 60 ? 20 : 10) : ((hi - lo) <= 25 ? 5 : 10), fmt: function (v) { return Number(v).toFixed(1).replace(/\.0$/, ''); } };
  }
  return chips('mock', items, sel) + trend(pts, o) +
    '<div class="legend"><span><i></i>本人</span><span><i class="dash"></i>班平均</span></div>' +
    (isTotal ? '' : '<p class="note" style="text-align:center">' + (isW ? '縱軸為加權分數(滿分 100),等級是依加權分數判定的。' : '縱軸為答對題數。') + '</p>');
}

function mean(a) {
  var n = a.filter(function (v) { return v != null; });
  return n.length ? n.reduce(function (s, v) { return s + v; }, 0) / n.length : null;
}

function distRow(s) {
  var max = Math.max.apply(null, s.dist.concat([1]));
  return '<div class="dist"><span class="nm">' + esc(s.name) + '</span>' +
    s.dist.map(function (n, i) {
      var me = s.bucket === i;
      return '<div class="c' + (me ? ' me' : '') + '"><span>' + n + '</span><div class="bar" style="height:' + Math.round(n / max * 30) + 'px"></div></div>';
    }).join('') + '</div>';
}

/* 雷達圖:list 為 [{name, score, classAvg}],max 為滿分,rings 為同心圈數 */
function radar(list, max, rings) {
  var W = 340, H = 300, cx = 170, cy = 150, R = 100, n = list.length;
  var pt = function (i, pct, r) {
    var a = -Math.PI / 2 + 2 * Math.PI * i / n, rr = (r != null ? r : R * Math.max(0, Math.min(100, pct)) / 100);
    return [cx + rr * Math.cos(a), cy + rr * Math.sin(a)];
  };
  var poly = function (vals) {
    return vals.map(function (v, i) { return pt(i, (v || 0) / max * 100).join(','); }).join(' ');
  };
  var g = '';
  for (var k = 1; k <= rings; k++) {
    g += '<polygon points="' + list.map(function (_, i) { return pt(i, k / rings * 100).join(','); }).join(' ') + '" fill="none" stroke="#D6DEE8" stroke-width="1"/>';
  }
  list.forEach(function (s, i) {
    var p = pt(i, 100), l = pt(i, 0, R + 20);
    var cos = Math.cos(-Math.PI / 2 + 2 * Math.PI * i / n);
    g += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0] + '" y2="' + p[1] + '" stroke="#D6DEE8"/>' +
      '<text x="' + l[0] + '" y="' + (l[1] + 4) + '" font-size="13" fill="#16233B" text-anchor="' + (Math.abs(cos) < 0.2 ? 'middle' : cos > 0 ? 'start' : 'end') + '">' + esc(s.name) + '</text>';
  });
  g += '<polygon points="' + poly(list.map(function (s) { return s.classAvg; })) + '" fill="none" stroke="#5B6780" stroke-width="2" stroke-dasharray="5 4"/>';
  g += '<polygon points="' + poly(list.map(function (s) { return s.score; })) + '" fill="rgba(43,92,148,.22)" stroke="#2B5C94" stroke-width="2.5"/>';
  return '<svg class="radar" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="各科成績與班平均的雷達圖">' + g + '</svg>';
}

/* ---------- 模擬考 ---------- */

function mockHtml(ex) {
  var h = blk('<div class="panel">' +
    '<div class="rank"><span class="big">' + fmt(ex.total) + '</span>' +
    (ex.classRank === 1 ? champBadge() : '') +
    '<span class="cap">總積分' + (ex.combo ? '(' + esc(ex.combo) + ')' : '') + '</span></div>' +
    '<div class="stats">' +
    rankStat('班排', ex.classRank) + rankStat('校排', ex.schoolRank, true) + rankStat('區排', ex.areaRank) +
    (ex.areaMaleRank != null ? rankStat('區男排', ex.areaMaleRank) : '') +
    (ex.areaFemaleRank != null ? rankStat('區女排', ex.areaFemaleRank) : '') +
    (ex.essay != null ? stat('作文級分', fmt(ex.essay)) : '') +
    '</div></div>', 'span');

  var rl = ex.subjects.map(function (s) { return { name: s.name, score: s.points, classAvg: s.classAvg }; });
  h += blk('<h2>各科積分</h2><div class="panel">' + radar(rl, 6, 6) +
    '<div class="legend"><span><i></i>本人</span><span><i class="dash"></i>班平均</span></div>' +
    '<p class="note" style="text-align:center">每一圈代表 1 分,最外圈為 6 分。</p></div>');

  var tbl = '<h2>各科結果</h2><div class="panel"><table><thead><tr><th>科目</th><th>答對題數</th><th>等級</th><th>積分</th><th>班平均</th></tr></thead><tbody>' +
    ex.subjects.map(function (s) {
      // 英語的答對題數顯示為「閱讀+聽力」,例如 43+21
      var correct = (s.name === '英語' && s.extra && (s.extra.reading != null || s.extra.listening != null))
        ? fmt(s.extra.reading) + '+' + fmt(s.extra.listening) : fmt(s.correct);
      return '<tr><td>' + esc(s.name) + '</td><td>' + correct + '</td><td>' + esc(s.level || '—') + '</td><td>' + fmt(s.points) + '</td><td>' + fmt(s.classAvg, 1) + '</td></tr>';
    }).join('') + '</tbody></table>';

  var m = ex.subjects[1].extra, e = ex.subjects[2].extra;
  h += blk(tbl + '<p class="note">數學:選擇題答對 ' + fmt(m.choice) + ' 題;非選擇題第 1 題 ' + fmt(m.q1) + '、第 2 題 ' + fmt(m.q2) +
    '(級分 ' + fmt(m.nonChoiceGrade) + ');加權分數 ' + fmt(m.weighted) + '。</p>' +
    '<p class="note">英語:閱讀答對 ' + fmt(e.reading) + ' 題(' + esc(e.readingLevel || '—') + ');聽力答對 ' + fmt(e.listening) +
    ' 題(' + esc(e.listeningLevel || '—') + ');加權分數 ' + fmt(e.weighted) + '。</p></div>');

  h += diagnosisHtml(ex);

  h += blk('<h2>全班總積分分布</h2><div class="panel">' + hist(ex) +
    '<p class="note">全班 ' + ex.classSize + ' 人,平均 ' + fmt(ex.classAvg, 1) + ' 分;藍色為你所在的區間,「30滿分」為滿分的人數。</p></div>');
  return h;
}

/* ---------- 模擬考診斷分析 ---------- */

function signed(v, d) { var t = Math.abs(v).toFixed(d == null ? 0 : d); return Number(t) === 0 ? t : (v > 0 ? '+' : '−') + t; }

function diagnosisHtml(ex) {
  var all = state.data.exams.filter(function (e) { return e.type === 'mock' && e.status === 'ok'; });
  var at = all.indexOf(ex), prev = at > 0 ? all[at - 1] : null;

  // 各科:較班平均、較上次、判讀
  var rows = ex.subjects.map(function (s, i) {
    var vc = (s.points != null && s.classAvg != null) ? s.points - s.classAvg : null;
    var ps = prev && prev.subjects[i] ? prev.subjects[i].points : null;
    var vp = (s.points != null && ps != null) ? s.points - ps : null;
    var tag = vc == null ? ['—', ''] : vc >= 0.5 ? ['強項', 'good'] : vc <= -0.5 ? ['待加強', 'warn'] : ['持平', ''];
    return { name: s.name, points: s.points, vc: vc, vp: vp, tag: tag };
  });
  var strong = rows.filter(function (r) { return r.tag[0] === '強項'; });
  var weak = rows.filter(function (r) { return r.tag[0] === '待加強'; });
  var weakest = weak.slice().sort(function (a, b) { return a.vc - b.vc; })[0];

  var h = blk('<h2>診斷分析</h2>' + strategyHtml(ex, rows, prev)) + '<div class="blk"><h2>各科判讀</h2><div class="panel">';

  h += '<table><thead><tr><th>科目</th><th>積分</th><th>較班平均</th><th>' + '較上次' + '</th><th>判讀</th></tr></thead><tbody>' +
    rows.map(function (r) {
      return '<tr><td>' + esc(r.name) + '</td><td>' + fmt(r.points) + '</td>' +
        '<td class="' + (r.vc == null || r.vc === 0 ? '' : r.vc > 0 ? 'up' : 'down') + '">' + (r.vc == null ? '—' : signed(r.vc, 1)) + '</td>' +
        '<td class="' + (r.vp == null || r.vp === 0 ? '' : r.vp > 0 ? 'up' : 'down') + '">' + (r.vp == null ? '—' : signed(r.vp)) + '</td>' +
        '<td><span class="tag ' + r.tag[1] + '">' + r.tag[0] + '</span></td></tr>';
    }).join('') + '</tbody></table>';

  // 重點說明
  var li = [];
  if (ex.total != null && ex.classAvg != null) {
    var d = ex.total - ex.classAvg;
    li.push('本次總積分 ' + fmt(ex.total) + ' 分,' + (d >= 0 ? '高於' : '低於') + '全班平均 ' + Math.abs(d).toFixed(1) +
      ' 分(班平均 ' + fmt(ex.classAvg, 1) + ')' + (ex.classRank != null ? ',班排第 ' + ex.classRank + ' 名' : '') + '。');
  }
  if (prev && prev.total != null && ex.total != null) {
    var dt = ex.total - prev.total, s2 = '與上一次(' + esc(prev.label) + ')相比,總積分' + (dt === 0 ? '持平' : (dt > 0 ? '進步 ' : '退步 ') + Math.abs(dt) + ' 分');
    if (prev.classRank != null && ex.classRank != null && prev.classRank !== ex.classRank) {
      var dr = prev.classRank - ex.classRank;
      s2 += ',班排' + (dr > 0 ? '前進 ' : '後退 ') + Math.abs(dr) + ' 名';
    }
    li.push(s2 + '。');
  }
  if (ex.schoolRank != null) {
    li.push(ex.schoolRank <= AWARD_TOP ? '校排在前 ' + AWARD_TOP + ' 名內。' : '距離校排前 ' + AWARD_TOP + ' 名還差 ' + (ex.schoolRank - AWARD_TOP) + ' 名。');
  }
  h += '<ul class="diag">' + li.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>';

  // 趨勢
  h += '<p class="note">「強項」「待加強」是依本次積分與班平均相差 0.5 分以上自動判讀,僅供參考,不代表完整的學習評估,建議與導師一起討論。</p></div></div>';
  h += blk('<h2>歷次模擬考趨勢</h2><div class="panel"><div id="trend-mock">' + mockTrendBody(ex) + '</div></div>');
  return h;
}

/* ---------- 弱點擊破策略(依成績規則自動產生,非 AI) ---------- */

var LV_ORDER = ['C', 'B', 'B+', 'B++', 'A', 'A+', 'A++'];   // 由低到高
var FULL_POINTS = 6;                                         // 各科滿分積分(五科共 30)
function lvCode(s) { var m = /[(（]([ABC]\+*)[)）]/.exec(s || ''); return m ? m[1] : null; }
function lvRank(c) { return LV_ORDER.indexOf(c); }

var TIPS = {
  '國文': '把複習重心放在閱讀理解與整合題:每週精讀 2 篇長文,整理錯題是「讀不懂題目」還是「抓錯重點」,並練習作文的結構與論證。',
  '數學': '每天限時練習 2 題非選擇題,重點是完整寫出算式與理由;另外整理選擇題的粗心失分,把計算與審題的錯誤分開記錄。',
  '社會': '針對錯題做跨單元整合,把歷史時序、地理位置與公民概念交叉對照,不要只靠重複刷題。',
  '自然': '回頭整理錯題涉及的觀念與實驗,練習圖表判讀,並用自己的話說明推理過程。'
};

function gapText(g) {
  var amount;
  if (g.unit === '分') {
    var lo = Number(g.lo).toFixed(1), hi = Number(g.hi).toFixed(1);
    amount = g.lo === g.hi ? '還差 ' + hi + ' 分' : (g.lo <= 0.05 ? '最多還差 ' + hi + ' 分' : '約還差 ' + lo + '–' + hi + ' 分');
  } else {
    amount = g.lo === g.hi ? '還差 ' + g.lo + ' 題' : '約還差 ' + g.lo + '–' + g.hi + ' 題';
  }
  var t = '「' + esc(g.item) + '」目前 ' + esc(g.level) + ',距離 ' + esc(g.next) + ' ' + amount + (g.exact ? '(依老師公布的門檻)' : '(依全班成績估計)');
  if (g.equiv) {
    var c = g.equiv.choice, eq = '約相當於多對 ' + (c[0] === c[1] ? c[0] : c[0] + '–' + c[1]) + ' 題選擇題(每題 ' + g.equiv.choicePts + ' 分)';
    if (g.equiv.grade) eq += ',或非選擇題多 ' + (g.equiv.grade[0] === g.equiv.grade[1] ? g.equiv.grade[0] : g.equiv.grade[0] + '–' + g.equiv.grade[1]) + ' 級分(每級分 ' + g.equiv.gradePts + ' 分)';
    t += ';' + eq;
  }
  return t + '。';
}

function strategyHtml(ex, rows, prev) {
  var subs = ex.subjects;
  var codes = subs.map(function (s) { return lvCode(s.level); });
  var known = codes.filter(Boolean);
  var cnt = function (f) { return known.filter(f).length; };
  var top = cnt(function (c) { return c === 'A++'; }), aUp = cnt(function (c) { return c.charAt(0) === 'A'; }),
      bs = cnt(function (c) { return c.charAt(0) === 'B'; }), cs = cnt(function (c) { return c.charAt(0) === 'C'; });

  // 1. 成績結構診斷
  var type = null, desc = '';
  if (known.length === subs.length) {
    if (top === subs.length) { type = '全科頂尖型'; desc = '各科都達到 A++,實力非常整齊,重點是維持穩定、避免粗心失誤。'; }
    else if (top >= 3) { type = '頂尖高手微調型'; desc = '已有 ' + top + ' 科達到 A++,基礎相當扎實;其餘科目只要再補強,就有機會進一步拉高總積分。'; }
    else if (aUp === subs.length) { type = '穩健精熟型'; desc = '五科都在精熟(A)以上,實力穩定,可以朝 A+、A++ 再挑戰。'; }
    else if (aUp >= 3) { type = '優勢科目明顯型'; desc = '有 ' + aUp + ' 科已達精熟,基礎級(B)的科目是接下來提升總積分的關鍵。'; }
    else if (cs === 0) { type = '基礎累積型'; desc = '多數科目在基礎(B)等級,把基本題型答對、減少粗心,就能穩定往精熟(A)邁進。'; }
    else { type = '基礎補強型'; desc = '有科目落在待加強(C),建議先把課本基本概念與常見題型練熟,再逐步提高難度。'; }
  }
  var h = '<div class="panel strat"><h3>成績結構診斷</h3>' +
    '<p class="meta">總積分 ' + fmt(ex.total) + ' 分' + (ex.combo ? ' · 標示組合 ' + esc(ex.combo) : '') + '</p>' +
    (type ? '<p><b>' + type + '</b>:' + desc + '</p>' : '<p>等級資料不完整,暫時無法判斷成績結構。</p>');

  // 2. 關鍵瓶頸
  var bl = [];
  var scored = subs.map(function (s, i) { return { s: s, r: rows[i] }; }).filter(function (x) { return x.s.points != null; });
  scored.sort(function (a, b) { return (a.s.points - b.s.points) || ((a.r.vc == null ? 0 : a.r.vc) - (b.r.vc == null ? 0 : b.r.vc)); });
  var low = scored[0], focus = null;
  if (low) {
    if (low.s.points >= FULL_POINTS) {
      var lv = subs.map(function (s, i) { return { s: s, c: codes[i] }; }).filter(function (x) { return x.c; })
        .sort(function (a, b) { return lvRank(a.c) - lvRank(b.c); });
      if (lv.length && lv[0].c !== 'A++') {
        focus = lv[0].s.name;
        bl.push('各科積分都已拿到最高 ' + FULL_POINTS + ' 分;等級最低的是「' + esc(lv[0].s.name) + '」(' + lv[0].c + (lv[0].s.correct != null ? ',答對 ' + lv[0].s.correct + ' 題' : '') + '),往 A++ 精進是進一步拉高表現的關鍵。');
      } else {
        bl.push('各科都達到最高積分與 A++ 等級,沒有明顯弱點,重點是維持穩定。');
      }
    } else {
      focus = low.s.name;
      var same = scored.filter(function (x) { return x !== low && x.s.points === low.s.points; });
      bl.push('積分最低的是「' + esc(low.s.name) + '」(' + esc(low.s.level || '—') + ',積分 ' + low.s.points +
        (low.s.correct != null ? ',答對 ' + low.s.correct + ' 題' : '') + '),距離該科最高積分 ' + FULL_POINTS + ' 分還差 ' + (FULL_POINTS - low.s.points) + ' 分。' +
        (same.length >= 2 ? '多科積分相同,因此以落後班平均最多的「' + esc(low.s.name) + '」為優先。'
          : same.length === 1 ? '「' + esc(same[0].s.name) + '」同為最低積分。' : ''));
    }
  }
  var math = subs[1], eng = subs[2], weakPart = null;
  if (math && math.extra && math.extra.q1 != null && math.extra.q2 != null && math.points != null && math.points < FULL_POINTS) {
    bl.push('數學非選擇題第 1、2 題分別得 ' + math.extra.q1 + '、' + math.extra.q2 + ' 分' +
      (math.extra.nonChoiceGrade != null ? '(級分 ' + math.extra.nonChoiceGrade + ')' : '') + ',可檢視作答過程是否完整。');
  }
  if (eng && eng.extra) {
    var rc = lvCode(eng.extra.readingLevel), lc = lvCode(eng.extra.listeningLevel);
    if (rc && lc && rc !== lc) {
      weakPart = lvRank(rc) < lvRank(lc) ? '閱讀' : '聽力';
      bl.push('英語閱讀(' + rc + ')與聽力(' + lc + ')有差距,' + weakPart + '相對較弱。');
    }
  }
  h += '<h3>關鍵瓶頸</h3>' + (bl.length ? '<ul>' + bl.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>' : '<p>資料不足,無法判斷。</p>');

  // 距離下一等級(有 gaps 資料才顯示)
  var hasGaps = subs.some(function (s) { return s.gaps; });
  if (hasGaps) {
    var gaps = [];
    subs.forEach(function (s) { (s.gaps || []).forEach(function (g) { gaps.push(g); }); });
    var near = gaps.filter(function (g) { return !g.top && !g.unknown && g.lo != null; });
    var unk = gaps.filter(function (g) { return g.unknown; });
    // 「最接近升級」只拿能換算成題數的項目比較(題數項目,以及可換算成選擇題題數的數學)
    var comparable = near.map(function (g) {
      var n = g.unit === '分' ? (g.equiv ? g.equiv.choice[1] : null) : g.hi;
      return n == null ? null : { g: g, n: n };
    }).filter(Boolean).sort(function (a, b) { return a.n - b.n; });
    var gl = near.map(gapText);
    unk.forEach(function (g) { gl.push('「' + esc(g.item) + '」目前 ' + esc(g.level) + ':全班還沒有同學達到 ' + esc(g.next) + ',暫時無法估計門檻。'); });
    if (!near.length && !unk.length) gl.push('可計算的項目都已經是最高等級。');
    h += '<h3>距離下一等級</h3>' +
      (comparable.length ? '<p>最接近升級的是「' + esc(comparable[0].g.item) + '」。</p>' : '') +
      '<ul>' + gl.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>' +
      (near.some(function (g) { return !g.exact; }) ? '<p class="note">估計值依本班同學的成績推算門檻所在的範圍,實際門檻以老師公布的為準。數學、英語總等級以加權分數計算,所以用「分」表示。</p>'
        : near.some(function (g) { return g.unit === '分'; }) ? '<p class="note">數學、英語總等級以加權分數計算,所以用「分」表示。</p>' : '');
  }

  // 3. 下階段建議
  var acts = [];
  if (focus) {
    var tip = focus === '英語'
      ? (weakPart === '聽力' ? '每天做 10–15 分鐘聽力練習,先完整聽一遍再對照原文,整理聽不出來的字詞與句型。'
        : weakPart === '閱讀' ? '增加長篇閱讀練習,先抓段落大意再看細節,並把不熟的字彙與句型整理成清單。'
        : '閱讀與聽力都安排固定練習,每週至少各 2 次,並整理錯題中的字彙與句型。')
      : TIPS[focus];
    if (tip) acts.push('「' + esc(focus) + '」優先安排複習時間:' + tip);
  }
  var dec = rows.filter(function (r) { return r.vp != null && r.vp < 0; }).sort(function (a, b) { return a.vp - b.vp; })[0];
  if (dec) acts.push('「' + esc(dec.name) + '」比上一次退步 ' + Math.abs(dec.vp) + ' 分,建議先檢視這次的錯題,看看是不是和上次同一類型。');
  var strongNames = subs.filter(function (s, i) { return codes[i] === 'A++'; }).map(function (s) { return esc(s.name); });
  if (strongNames.length && strongNames.length < subs.length) acts.push('「' + strongNames.join('、') + '」已達 A++,每週保持少量練習維持手感即可,把時間留給弱項。');
  if (!hasGaps) acts.push('若想知道距離下一個等級還差幾題,請對照老師公布的各科等級門檻。');
  h += '<h3>下階段建議</h3><ol>' + acts.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ol>' +
    '<p class="note">這份策略由系統依成績與等級自動產生(非 AI),各科最高積分以 ' + FULL_POINTS + ' 分計,僅供參考,建議與導師一起討論。</p></div>';
  return h;
}

/* 趨勢圖:pts 為 [{label, v, c, me}](v 本人、c 班平均、me 是否為目前這次),o 為 {min, max, step, fmt} */
function trend(pts, o) {
  var W = 340, H = 200, L = 34, Rr = 14, T = 18, B = 42;
  var x = function (i) { return pts.length === 1 ? (L + W - Rr) / 2 : L + (W - L - Rr) * i / (pts.length - 1); };
  var y = function (v) { return T + (H - T - B) * (1 - (Math.max(o.min, Math.min(o.max, v)) - o.min) / (o.max - o.min)); };
  var g = '';
  for (var t = o.min; t <= o.max; t += o.step) {
    g += '<line x1="' + L + '" x2="' + (W - Rr) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="#D6DEE8"/>' +
      '<text x="' + (L - 6) + '" y="' + (y(t) + 4) + '" font-size="11" text-anchor="end" fill="#5B6780">' + t + '</text>';
  }
  var line = function (key, stroke, dash) {
    var p = pts.map(function (e, i) { return e[key] != null ? x(i) + ',' + y(e[key]) : null; }).filter(Boolean).join(' ');
    return p ? '<polyline points="' + p + '" fill="none" stroke="' + stroke + '" stroke-width="2"' + (dash ? ' stroke-dasharray="5 4"' : '') + '/>' : '';
  };
  g += line('c', '#5B6780', true) + line('v', '#2B5C94', false);
  pts.forEach(function (e, i) {
    var parts = e.label.split(' '), fill = e.me ? '#2B5C94' : '#5B6780', fw = e.me ? ' font-weight="700"' : '';
    parts.forEach(function (p, k) {
      g += '<text x="' + x(i) + '" y="' + (H - B + 16 + k * 13) + '" font-size="11" text-anchor="middle" fill="' + fill + '"' + fw + '>' + esc(p) + '</text>';
    });
    if (e.v != null) {
      g += '<circle cx="' + x(i) + '" cy="' + y(e.v) + '" r="' + (e.me ? 5 : 3.5) + '" fill="' + (e.me ? '#2B5C94' : '#fff') + '" stroke="#2B5C94" stroke-width="2"/>' +
        '<text x="' + x(i) + '" y="' + (y(e.v) - 9) + '" font-size="11" text-anchor="middle" fill="#16233B">' + o.fmt(e.v) + '</text>';
    }
  });
  return '<svg class="trend" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="歷次成績趨勢圖">' + g + '</svg>';
}

var HLOW = [0, 6, 10, 14, 18, 22, 26, 30];
var HLAB = ['5以下', '6–9', '10–13', '14–17', '18–21', '22–25', '26–29', '30滿分'];
function hbin(v) { var k = 0; for (var i = 0; i < HLOW.length; i++) if (v >= HLOW[i]) k = i; return k; }

function hist(ex) {
  var t = ex.classTotals; if (!t.length) return '';
  var cnt = HLOW.map(function () { return 0; });
  t.forEach(function (v) { cnt[hbin(v)]++; });
  var max = Math.max.apply(null, cnt.concat([1])), mine = hbin(ex.total);
  return '<div class="hist">' + cnt.map(function (n, i) {
    return '<div class="col' + (i === mine ? ' me' : '') + '"><span>' + n + '</span><div class="bar" style="height:' + Math.round(n / max * 62) + 'px"></div><span>' + HLAB[i] + '</span></div>';
  }).join('') + '</div>';
}
</script>
